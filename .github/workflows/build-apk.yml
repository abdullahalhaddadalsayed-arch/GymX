name: Build GymX Offline ML APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract GymX Offline ML source
        run: |
          test -f GymX_Offline_ML_Source_v02.zip || { echo "Upload GymX_Offline_ML_Source_v02.zip to the root of the repository first."; exit 1; }
          unzip -oq GymX_Offline_ML_Source_v02.zip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download MobileNetV3 model during build
        run: |
          curl --fail --location --retry 3 --output android-app/app/src/main/assets/mobilenet_v3_small.tflite 'https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite'
          test $(stat -c %s android-app/app/src/main/assets/mobilenet_v3_small.tflite) -gt 100000
      - name: Build GymX APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GymX-Offline-ML-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
