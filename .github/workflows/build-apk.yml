name: Build GymX v0.4 Free Exercise DB APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GymX_FreeDB_Source_v04.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GymX source repository
        uses: actions/checkout@v4

      - name: Extract GymX v0.4 source
        run: |
          test -f GymX_FreeDB_Source_v04.zip || { echo "Upload GymX_FreeDB_Source_v04.zip to the repository root first."; exit 1; }
          unzip -oq GymX_FreeDB_Source_v04.zip

      - name: Download Free Exercise DB
        run: |
          curl --fail --location --retry 3 --output /tmp/free-exercise-db.zip https://codeload.github.com/yuhonas/free-exercise-db/zip/refs/heads/main
          unzip -q /tmp/free-exercise-db.zip -d /tmp
          test -f /tmp/free-exercise-db-main/dist/exercises.json

      - name: Import exercises and offline JPGs
        run: |
          python3 patch_gymx_freedb_v04.py android-app
          python3 build_gymx_freedb_v04.py --android-app android-app --free-db /tmp/free-exercise-db-main
          node --check android-app/app/src/main/assets/app.js
          node --check android-app/app/src/main/assets/exercises.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download offline machine embedding model
        run: |
          curl --fail --location --retry 3 --output android-app/app/src/main/assets/mobilenet_v3_small.tflite https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite
          test $(stat -c %s android-app/app/src/main/assets/mobilenet_v3_small.tflite) -gt 100000

      - name: Build GymX APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload GymX v0.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: GymX-v04-FreeDB-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GymX-v04-Import-Report
          path: android-app/import-results.json
          if-no-files-found: warn
