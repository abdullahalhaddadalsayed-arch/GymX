name: Build GymX and publish signed updates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract current GymX v0.4 source
        run: |
          unzip -oq GymX_FreeDB_Source_v04.zip
          test -f android-app/app/src/main/java/com/gymx/app/OfflineMachineMatcher.kt
      - name: Download Free Exercise DB
        run: |
          curl --fail --location --retry 3 --output /tmp/free-exercise-db.zip https://codeload.github.com/yuhonas/free-exercise-db/zip/refs/heads/main
          unzip -q /tmp/free-exercise-db.zip -d /tmp
          test -f /tmp/free-exercise-db-main/dist/exercises.json
      - name: Import exercises and keep existing offline machine identification
        run: |
          python3 patch_gymx_freedb_v04.py android-app
          python3 build_gymx_freedb_v04.py --android-app android-app --free-db /tmp/free-exercise-db-main
      - name: Inject new in-app updater
        run: |
          python3 updater/install_updates_v04.py --android-app android-app
          python3 updater/enable_library_photos.py --android-app android-app
          node --check android-app/app/src/main/assets/gymx-library-images.js
          node --check android-app/app/src/main/assets/app.js
          node --check android-app/app/src/main/assets/gymx-updates.js
          node --check android-app/app/src/main/assets/exercises.js
      - name: Download pinned offline anatomical male body map
        run: |
          mkdir -p /tmp/gymx-anatomy-pkg
          npm pack @emmorts/body-muscles@2.1.1 --pack-destination /tmp/gymx-anatomy-pkg --silent
          tar -xzf /tmp/gymx-anatomy-pkg/emmorts-body-muscles-2.1.1.tgz -C /tmp/gymx-anatomy-pkg
          test -f /tmp/gymx-anatomy-pkg/package/dist/umd/body-muscles.umd.min.js
      - name: Integrate GymX premium anatomical UI
        run: |
          python3 updater/enable_v05_design.py --android-app android-app --anatomy-package /tmp/gymx-anatomy-pkg/package
          node --check android-app/app/src/main/assets/gymx-anatomy.js
          node --check android-app/app/src/main/assets/gymx-premium-design.js
          grep -q 'gymx-anatomy.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-library-images.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-updates.js' android-app/app/src/main/assets/index.html
      - name: Version every build
        run: |
          echo "GYMX_VERSION_CODE=$((500000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "GYMX_VERSION_NAME=0.5.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download on-device machine matching model
        run: |
          curl --fail --location --retry 3 --output android-app/app/src/main/assets/mobilenet_v3_small.tflite https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite
          test "$(stat -c %s android-app/app/src/main/assets/mobilenet_v3_small.tflite)" -gt 100000
      - name: Build test APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GymX-debug-test-only
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check private signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GYMX_RELEASE_KEYSTORE_B64 }}
          GYMX_KEYSTORE_PASSWORD: ${{ secrets.GYMX_KEYSTORE_PASSWORD }}
          GYMX_KEY_ALIAS: ${{ secrets.GYMX_KEY_ALIAS }}
          GYMX_KEY_PASSWORD: ${{ secrets.GYMX_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$GYMX_KEYSTORE_PASSWORD" ] && [ -n "$GYMX_KEY_ALIAS" ] && [ -n "$GYMX_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-app/app/gymx-release.jks
            chmod 600 android-app/app/gymx-release.jks
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Configure four secure signing secrets before publishing signed APKs.'
          fi
      - name: Build signed update APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-app
        env:
          GYMX_KEYSTORE_PASSWORD: ${{ secrets.GYMX_KEYSTORE_PASSWORD }}
          GYMX_KEY_ALIAS: ${{ secrets.GYMX_KEY_ALIAS }}
          GYMX_KEY_PASSWORD: ${{ secrets.GYMX_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish new signed update in GitHub Releases
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk GymX.apk
          gh release create "v${GYMX_VERSION_NAME}" "GymX.apk" --repo "$GITHUB_REPOSITORY" --title "GymX v${GYMX_VERSION_NAME}" --notes "New signed GymX update. Open GymX Settings > Check for updates."
      - name: Delete temporary signing key
        if: always()
        run: rm -f android-app/app/gymx-release.jks
