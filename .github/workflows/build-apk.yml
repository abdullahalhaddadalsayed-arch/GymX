name: Build GymX and publish signed updates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gymx-main-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract current GymX v0.4 source
        run: |
          unzip -oq GymX_FreeDB_Source_v04.zip
          test -f android-app/app/src/main/java/com/gymx/app/OfflineMachineMatcher.kt
      - name: Download Free Exercise DB
        run: |
          curl --fail --location --retry 3 --output /tmp/free-exercise-db.zip https://codeload.github.com/yuhonas/free-exercise-db/zip/f00c92c7dcf1216a928a52c3706c7ce8e2f71ed5
          unzip -q /tmp/free-exercise-db.zip -d /tmp
          test -f /tmp/free-exercise-db-f00c92c7dcf1216a928a52c3706c7ce8e2f71ed5/dist/exercises.json
      - name: Import exercises and keep existing offline machine identification
        run: |
          python3 patch_gymx_freedb_v04.py android-app
          python3 build_gymx_freedb_v04.py --android-app android-app --free-db /tmp/free-exercise-db-f00c92c7dcf1216a928a52c3706c7ce8e2f71ed5
      - name: Inject new in-app updater
        run: |
          python3 updater/install_updates_v04.py --android-app android-app
          python3 updater/enable_library_photos.py --android-app android-app
          python3 updater/enable_premium_library.py --android-app android-app
          node --check android-app/app/src/main/assets/gymx-premium-library.js
          node --check android-app/app/src/main/assets/gymx-library-images.js
          node --check android-app/app/src/main/assets/app.js
          node --check android-app/app/src/main/assets/gymx-updates.js
          node --check android-app/app/src/main/assets/exercises.js
      - name: Integrate GymX premium anatomical UI
        run: |
          python3 updater/enable_v05_design.py --android-app android-app
          node --check android-app/app/src/main/assets/gymx-anatomy.js
          node --check android-app/app/src/main/assets/gymx-premium-design.js
          test -s android-app/app/src/main/assets/gx-human-front.webp
          test -s android-app/app/src/main/assets/gx-human-back.webp
          grep -q 'gymx-anatomy.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-library-images.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-updates.js' android-app/app/src/main/assets/index.html
      - name: Verify 36 human-reviewed exercise START and END photo guides
        run: |
          python3 updater/enable_reviewed_movements.py --android-app android-app --free-db /tmp/free-exercise-db-f00c92c7dcf1216a928a52c3706c7ce8e2f71ed5
          node --check android-app/app/src/main/assets/gymx-reviewed-guide-ui.js
          node --check android-app/app/src/main/assets/gymx-reviewed-guides.js
          grep -q 'gymx-reviewed-guide-ui.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-reviewed-guide-ui.css' android-app/app/src/main/assets/index.html
      - name: Install high-resolution offline male body visuals and honest guide fallback
        run: |
          mkdir -p /tmp/gymx-hires-body
          for side in front back; do
            curl --fail --location --retry 3 --retry-delay 2 --output "/tmp/gymx-hires-body/male-${side}.webp" \
              "https://raw.githubusercontent.com/Jsplice/MuscleMap/170cfacda79376dd59ac0cf2f7dfab8ff9f4443a/packages/assets/bodies/male-${side}.webp"
          done
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/gymx-hires-body/LICENSE \
            "https://raw.githubusercontent.com/Jsplice/MuscleMap/170cfacda79376dd59ac0cf2f7dfab8ff9f4443a/LICENSE"
          python3 updater/install_visual_quality.py --android-app android-app --image-dir /tmp/gymx-hires-body
          node --check android-app/app/src/main/assets/gymx-visual-quality.js
          test $(stat -c %s android-app/app/src/main/assets/gx-human-front.webp) -gt 50000
          test $(stat -c %s android-app/app/src/main/assets/gx-human-back.webp) -gt 50000
      - name: Enable secure YouTube deep links from GymX
        run: |
          python3 updater/install_jeff_videos.py --android-app android-app
          grep -q 'openJeffVideo(url: String)' android-app/app/src/main/java/com/gymx/app/MainActivity.kt
      - name: Add Jeff Nippard video links for every exercise
        run: |
          python3 updater/enable_jeff_nippard_videos.py --android-app android-app
          node --check android-app/app/src/main/assets/gymx-jeff-nippard-videos.js
          grep -q 'gymx-jeff-nippard-videos.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-jeff-nippard-videos.css' android-app/app/src/main/assets/index.html
      - name: Fetch licensed static RepDB exercise illustrations (no animations)
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --output /tmp/gymx-repdb-free.zip \
            "https://codeload.github.com/RepDB/exercise-dataset/zip/66c4298af8d99b9dc397dad6699e508fb871d249"
          unzip -q /tmp/gymx-repdb-free.zip -d /tmp
          test -f /tmp/exercise-dataset-66c4298af8d99b9dc397dad6699e508fb871d249/exercises.json
          test -f /tmp/exercise-dataset-66c4298af8d99b9dc397dad6699e508fb871d249/LICENSE-DATA.md
      - name: Audit every GymX image and add licensed static artwork for exact exercise matches
        run: |
          python3 updater/audit_and_integrate_images.py \
            --android-app android-app \
            --repdb /tmp/exercise-dataset-66c4298af8d99b9dc397dad6699e508fb871d249
          python3 updater/complete_missing_thumbnails.py \
            --android-app android-app \
            --repdb /tmp/exercise-dataset-66c4298af8d99b9dc397dad6699e508fb871d249
          python3 updater/install_image_quality.py --android-app android-app
          node --check android-app/app/src/main/assets/gymx-image-quality.js
          node --check android-app/app/src/main/assets/gymx-image-catalog.js
          test -s android-app/gymx-image-audit.csv
          test -s android-app/gymx-image-audit.json
          test -s android-app/gymx-image-summary.md
          grep -q 'gymx-image-quality.js' android-app/app/src/main/assets/index.html
      - name: Improve remaining 54 thumbnails with original schematic references
        run: |
          python3 updater/install_schematic_thumbnails.py --android-app android-app
          test "$(find android-app/app/src/main/assets/gymx-schematics -name '*.svg' | wc -l)" -eq 54
          test -s android-app/gymx-image-audit.json
          grep -q 'original_schematic_reference_thumbnails' android-app/gymx-image-audit.json
      - name: Install daily motivation and home update notices
        run: |
          python3 updater/install_home_features.py --android-app android-app
          node --check android-app/app/src/main/assets/gymx-home-features.js
          node --check android-app/app/src/main/assets/gymx-messages.js
          grep -q 'gymx-home-features.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-home-features.css' android-app/app/src/main/assets/index.html
          grep -q 'gymx-messages.js' android-app/app/src/main/assets/index.html
      - name: Install static human muscle map and Jeff-curated library
        run: |
          python3 updater/install_static_muscle_jeff.py --android-app android-app
          node --check android-app/app/src/main/assets/gymx-muscle-jeff-library.js
          node --check android-app/app/src/main/assets/gymx-static-human-fallback.js
          test -s android-app/app/src/main/assets/gymx-user-male-sprite.webp
          grep -q 'gymx-muscle-jeff-library.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-static-human-fallback.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-static-muscle-jeff.css' android-app/app/src/main/assets/index.html
          ! find android-app/app/src/main/assets -type f \( -iname '*.gif' -o -iname '*.apng' -o -iname '*.webm' \) | grep .
      - name: Apply user-facing human model and library layout corrections
        run: |
          python3 updater/install_ui_corrections.py --android-app android-app
          node --check android-app/app/src/main/assets/gymx-ui-corrections.js
          test -s android-app/app/src/main/assets/gymx-user-front-base.webp
          grep -q 'gymx-ui-corrections.js' android-app/app/src/main/assets/index.html
          grep -q 'gymx-ui-corrections.css' android-app/app/src/main/assets/index.html
          ! find android-app/app/src/main/assets -type f \( -iname '*.gif' -o -iname '*.apng' -o -iname '*.webm' \) | grep .
      - name: Save full image coverage QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: GymX-all-exercise-image-coverage
          path: |
            android-app/gymx-image-audit.csv
            android-app/gymx-image-audit.json
            android-app/gymx-image-summary.md
          if-no-files-found: error
      - name: Save new visual-quality QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: GymX-visual-quality-QA
          path: android-app/gymx-visual-quality-QA.json
          if-no-files-found: error
      - name: Save reviewed movement QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: GymX-verified-movement-QA
          path: android-app/reviewed-movements-QA.json
          if-no-files-found: error
      - name: Version every build
        run: |
          echo "GYMX_VERSION_CODE=$((500000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "GYMX_VERSION_NAME=0.5.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download on-device machine matching model
        run: |
          curl --fail --location --retry 3 --output android-app/app/src/main/assets/mobilenet_v3_small.tflite https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite
          test "$(stat -c %s android-app/app/src/main/assets/mobilenet_v3_small.tflite)" -gt 100000
      - name: Build test APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GymX-debug-test-only
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check private signing secrets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GYMX_RELEASE_KEYSTORE_B64 }}
          GYMX_KEYSTORE_PASSWORD: ${{ secrets.GYMX_KEYSTORE_PASSWORD }}
          GYMX_KEY_ALIAS: ${{ secrets.GYMX_KEY_ALIAS }}
          GYMX_KEY_PASSWORD: ${{ secrets.GYMX_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$GYMX_KEYSTORE_PASSWORD" ] && [ -n "$GYMX_KEY_ALIAS" ] && [ -n "$GYMX_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-app/app/gymx-release.jks
            chmod 600 android-app/app/gymx-release.jks
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Configure four secure signing secrets before publishing signed APKs.'
          fi
      - name: Build signed update APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-app
        env:
          GYMX_KEYSTORE_PASSWORD: ${{ secrets.GYMX_KEYSTORE_PASSWORD }}
          GYMX_KEY_ALIAS: ${{ secrets.GYMX_KEY_ALIAS }}
          GYMX_KEY_PASSWORD: ${{ secrets.GYMX_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Publish new signed update in GitHub Releases
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk GymX.apk
          gh release create "v${GYMX_VERSION_NAME}" "GymX.apk" "android-app/gymx-image-summary.md#GymX_Image_Coverage_Summary.md" --repo "$GITHUB_REPOSITORY" --title "GymX v${GYMX_VERSION_NAME}" --notes-file android-app/gymx-image-summary.md
      - name: Delete temporary signing key
        if: always()
        run: rm -f android-app/app/gymx-release.jks
